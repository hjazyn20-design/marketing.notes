,abbr:"LTV",category:"Analytics",definition:"Predicted net profit from entire relationship with customer.",example:"Starbucks LTV ~$14,000 per loyal customer.",formula:"LTV = ARPU × Gross Margin × (1/Churn)",proTip:"Track LTV:CAC ratio. 3:1 is gold standard.",level:"Intermediate"},{id:7,term:"Search Engine Optimization",abbr:"SEO",category:"Digital",definition:"Optimizing content to rank organically in search engines.",example:"Blog 'Best running shoes 2025' ranks #1 for intent keyword.",proTip:"E-E-A-T is Google's quality rater: Experience, Expertise, Authority, Trust.",level:"Beginner"},{id:8,term:"Search Engine Marketing",abbr:"SEM",category:"Digital",definition:"Paid search advertising on Google/Bing.",example:"Google Ads for 'buy iPhone' with ROAS tracking.",proTip:"Use SKAGs or themed ad groups for Quality Score 9-10.",level:"Beginner"},{id:9,term:"Return On Ad Spend",abbr:"ROAS",category:"Performance",definition:"Revenue generated per dollar spent on ads.",example:"Spend $1000, make $5000 revenue = 5x ROAS",formula:"ROAS = Revenue from Ads / Ad Cost",proTip:"Break-even ROAS = 1 / Profit Margin.",level:"Intermediate"},{id:10,term:"Key Performance Indicator",abbr:"KPI",category:"Analytics",definition:"Measurable value showing how effective you are at objectives.",example:"KPI for email: Open rate >45%, CTR >3%.",proTip:"Use North Star Metric + 3-5 supporting KPIs. Avoid vanity metrics.",level:"Beginner"},{id:11,term:"SWOT Analysis",category:"Strategy",definition:"Strengths, Weaknesses, Opportunities, Threats framework.",example:"Tesla SWOT: Strength=Brand, Weakness=Service, Opportunity=India, Threat=BYD.",proTip:"Do TOWS after SWOT to turn analysis into actions.",level:"Beginner"},{id:12,term:"PESTEL Analysis",category:"Strategy",definition:"Macro analysis: Political, Economic, Social, Tech, Environmental, Legal.",example:"PESTEL for Starbucks in China: Political trade tensions, Social tea culture.",proTip:"Combine with Porter's 5 Forces for full market picture.",level:"Intermediate"},{id:13,term:"Customer Journey Map",category:"Strategy",definition:"Visual of steps customer takes from awareness to advocacy.",example:"Journey: Sees ad → Reads reviews → Tries sample → Buys → Posts UGC.",proTip:"Map emotions, not just touchpoints. Find anxiety moments.",level:"Intermediate"},{id:14,term:"Sales Funnel",category:"Strategy",definition:"Stages: TOFU (Awareness), MOFU (Consideration), BOFU (Conversion).",example:"Netflix Funnel: Trailer (TOFU) → Free trial page (MOFU) → Payment (BOFU)",proTip:"Create different content & KPIs for each stage.",level:"Beginner"},{id:15,term:"Growth Hacking",category:"Digital",definition:"Rapid experimentation across channels to identify growth levers.",example:"Dropbox referral: Give 500MB for inviting friend.",proTip:"Think AARRR framework: Acquisition, Activation, Retention, Referral, Revenue.",level:"Advanced"},{id:16,term:"Neuromarketing",category:"Branding",definition:"Applying neuroscience to understand consumer decisions.",example:"Coca-Cola red triggers appetite, eye-tracking to place CTA.",proTip:"Use loss aversion: 'Don't miss' outperforms 'Get now' by 2x.",level:"Advanced"},{id:17,term:"Unique Selling Proposition",abbr:"USP",category:"Branding",definition:"Distinct benefit that makes you different from competitors.",example:"Domino's original USP: '30 minutes or free'.",proTip:"Test USP with 'So what?' 5 times to get to real value.",level:"Beginner"},{id:18,term:"Brand Equity",category:"Branding",definition:"Value derived from consumer perception of brand name.",example:"Apple can charge $1000+ because of equity.",proTip:"Measure via price premium, preference, and recall.",level:"Intermediate"},{id:19,term:"Net Promoter Score",abbr:"NPS",category:"Analytics",definition:"Loyalty metric: % promoters minus % detractors.",example:"Apple NPS 72, industry avg 30.",formula:"NPS = %Promoters (9-10) - %Detractors (0-6)",proTip:"Close the loop: Contact detractors within 24h.",level:"Beginner"},{id:20,term:"Churn Rate",category:"Analytics",definition:"Percentage of customers who stop using product in period.",example:"SaaS with 5% monthly churn loses ~46% yearly.",formula:"Churn = Lost Customers / Start Customers",proTip:"Segment churn: voluntary vs involuntary (failed payments).",level:"Intermediate"},{id:21,term:"Conversion Rate",abbr:"CVR",category:"Performance",definition:"% of visitors who complete desired action.",example:"Landing page: 1000 visits, 50 signups = 5% CVR",formula:"CVR = Conversions / Visitors × 100",proTip:"Improve CVR before scaling traffic. 1%→2% doubles revenue.",level:"Beginner"},{id:22,term:"Cost Per Mille",abbr:"CPM",category:"Performance",definition:"Cost per 1000 ad impressions.",example:"Instagram CPM ~$6-10, TikTok ~$4-8.",formula:"CPM = (Ad Spend / Impressions) × 1000",proTip:"Use CPM for awareness, CPC for performance.",level:"Beginner"},{id:23,term:"Cost Per Click",abbr:"CPC",category:"Performance",definition:"Amount paid per ad click.",example:"Google 'insurance' CPC $50+, 't-shirt' $0.50.",proTip:"Google Quality Score can halve your CPC.",level:"Beginner"},{id:24,term:"Cost Per Lead",abbr:"CPL",category:"Performance",definition:"Cost to generate one qualified lead.",example:"B2B SaaS CPL $150-400.",formula:"CPL = Spend / Leads",proTip:"Track MQL to SQL rate to judge lead quality, not just CPL.",level:"Intermediate"},{id:25,term:"Return On Investment",abbr:"ROI",category:"Analytics",definition:"Profitability ratio of investment.",example:"Spend $10k, profit $30k = 200% ROI",formula:"ROI = (Gain - Cost)/Cost × 100",proTip:"Marketing ROI > 5:1 is excellent.",level:"Beginner"},{id:26,term:"Brand Persona",category:"Branding",definition:"Fictional character embodying brand traits.",example:"Nike persona: Determined athlete, 28, relentless.",proTip:"Give it name, Spotify playlist, and non-negotiables.",level:"Beginner"},{id:27,term:"Buyer Persona",category:"Strategy",definition:"Semi-fictional representation of ideal customer.",example:"SaaS persona: 'Marketing Mary, 34, CMO, hates manual reports'.",proTip:"Include pains, goals, objections, media habits.",level:"Beginner"},{id:28,term:"Touchpoint",category:"Strategy",definition:"Any interaction customer has with brand.",example:"Instagram ad, unboxing, support chat = touchpoints.",proTip:"Audit 50+ touchpoints. Consistency = trust.",level:"Beginner"},{id:29,term:"Omnichannel",category:"Digital",definition:"Seamless experience across all channels.",example:"Nike App → Store pickup → Same cart & loyalty.",proTip:"Omnichannel customers have 30% higher LTV.",level:"Intermediate"},{id:30,term:"User Generated Content",abbr:"UGC",category:"Social",definition:"Content created by customers, not brand.",example:"GoPro reposting customer surf videos.",proTip:"UGC gets 4x higher CTR than branded content.",level:"Beginner"},{id:31,term:"Influencer Marketing",category:"Social",definition:"Partnering with creators to reach their audience.",example:"Gymshark's athlete ambassadors.",proTip:"Nano (1-10k) have 7x engagement of mega influencers.",level:"Beginner"},{id:32,term:"Affiliate Marketing",category:"Performance",definition:"Pay commission for sales via partners.",example:"Amazon Associates 4% per sale.",proTip:"Give affiliates 30-day cookies + custom landing pages.",level:"Intermediate"},{id:33,term:"Content Marketing",category:"Content",definition:"Creating valuable content to attract, not interrupt.",example:"HubSpot blog driving 6M monthly organic visits.",proTip:"80% value, 20% pitch. Build trust before sale.",level:"Beginner"},{id:34,term:"Copywriting",category:"Content",definition:"Writing to persuade to take action.",example:"'Join 50,000+ founders getting 2x ROAS' - social proof + benefit.",proTip:"Use PAS: Problem, Agitate, Solution.",level:"Beginner"},{id:35,term:"Storytelling",category:"Branding",definition:"Using narrative to make brand memorable.",example:"Nike 'Just Do It' origin story of rebellion.",proTip:"Hero = customer, not brand. Brand = guide.",level:"Intermediate"},{id:36,term:"Positioning",category:"Branding",definition:"How you want to be perceived vs competitors in mind.",example:"Volvo = safety, Tesla = innovation.",proTip:"Own one word in mind. Use 'Only' test.",level:"Intermediate"},{id:37,term:"Differentiation",category:"Strategy",definition:"Making product stand out from competition.",example:"Liquid Death: Water in beer can, punk branding.",proTip:"Differentiation > better. Be different, not just better.",level:"Intermediate"},{id:38,term:"Value Proposition",category:"Strategy",definition:"Promise of value to be delivered.",example:"Uber: 'Tap, ride, gone - cheapest way to city'.",proTip:"Formula: We help [who] do [what] by [how] unlike [alt].",level:"Beginner"},{id:39,term:"Go To Market",abbr:"GTM",category:"Strategy",definition:"Plan to launch product to market and drive adoption.",example:"Notion GTM: PLG, templates, community champions.",proTip:"Include pricing, channels, sales playbook, success metrics.",level:"Intermediate"},{id:40,term:"Product Market Fit",abbr:"PMF",category:"Strategy",definition:"Being in good market with product satisfying market.",example:"Sean Ellis test: 40%+ would be very disappointed without product.",proTip:"PMF = retention curve flattens, organic growth >50%.",level:"Advanced"},{id:41,term:"Viral Coefficient",abbr:"K-factor",category:"Analytics",definition:"Number of new users each user brings.",example:"If each user invites 0.5 new users, K=0.5",formula:"K = Invites per user × Conversion %",proTip:"K>1 = exponential viral growth.",level:"Advanced"},{id:42,term:"A/B Testing",category:"Performance",definition:"Compare two versions to see which performs better.",example:"Test blue CTA vs green CTA, blue wins 12% more clicks.",proTip:"Test one variable, need 95% statistical significance.",level:"Beginner"},{id:43,term:"Landing Page",category:"Digital",definition:"Standalone page focused on single conversion goal.",example:"ClickUp landing for 'project management software' with demo form.",proTip:"1 goal, 1 CTA, no navigation. Match headline to ad.",level:"Beginner"},{id:44,term:"Lead Magnet",category:"Content",definition:"Free incentive to capture email.",example:"'50 Hook Templates' PDF for email.",proTip:"High perceived value, instant gratification, specific.",level:"Beginner"},{id:45,term:"Email Open Rate",category:"Email",definition:"% of delivered emails opened.",example:"Welcome email 60% open, promo 25%.",formula:"Open Rate = Opens / Delivered ×100",proTip:"Personalized subject + preview text boost 20%.",level:"Beginner"},{id:46,term:"Email CTR",category:"Email",definition:"Clicks within email vs delivered.",example:"Newsletter CTR 3-5% is strong.",proTip:"One CTA per email, button > link.",level:"Beginner"},{id:47,term:"Drip Campaign",category:"Email",definition:"Automated sequence based on triggers.",example:"Abandon cart: 1h, 24h, 72h emails.",proTip:"Map to user intent stage, not just time.",level:"Intermediate"},{id:48,term:"Segmentation",category:"Email",definition:"Dividing email list into groups.",example:"Segment by purchase, engagement, LTV.",proTip:"Segmented emails drive 58% of revenue.",level:"Beginner"},{id:49,term:"Personalization",category:"Digital",definition:"Tailoring experience to individual.",example:"Spotify Wrapped: personalized year review.",proTip:"Start with name, behavior, dynamic content.",level:"Intermediate"},{id:50,term:"Retargeting",category:"Digital",definition:"Show ads to people who visited site.",example:"Saw shoes, ads follow you for 7 days.",proTip:"Cap frequency 3-5x per week, exclude converters.",level:"Beginner"},{id:51,term:"Lookalike Audience",category:"Digital",definition:"New audience similar to existing customers.",example:"1% LAL of purchasers on Meta.",proTip:"Seed with 1k-5k high-value customers for best LAL.",level:"Intermediate"},{id:52,term:"Customer Segmentation",category:"Analytics",definition:"Grouping customers by behavior/value.",example:"RFM: Recency, Frequency, Monetary.",proTip:"Use RFM to find Champions vs At-Risk.",level:"Intermediate"},{id:53,term:"Customer Retention",category:"Strategy",definition:"Keeping existing customers.",example:"Apple retention via ecosystem lock-in.",proTip:"Retention 5x cheaper than acquisition. Focus 30% budget there.",level:"Beginner"},{id:54,term:"Churn Prevention",category:"Analytics",definition:"Tactics to reduce churn.",example:"Exit survey + save offer 20% off.",proTip:"Predict churn with usage drop 40%+ 2 weeks before.",level:"Advanced"},{id:55,term:"Upselling",category:"Strategy",definition:"Sell higher-tier version.",example:"Spotify Free → Premium upsell.",proTip:"Upsell after value moment, not signup.",level:"Beginner"},{id:56,term:"Cross Selling",category:"Strategy",definition:"Sell complementary products.",example:"Amazon 'Frequently bought together'.",proTip:"Cross-sell at checkout or post-purchase, not before.",level:"Beginner"},{id:57,term:"Freemium",category:"Strategy",definition:"Free basic, pay for advanced.",example:"Canva free, Pro $12.99/mo.",proTip:"Limit value metric, not features.",level:"Intermediate"},{id:58,term:"Pay Per Click",abbr:"PPC",category:"Performance",definition:"Pay only when ad clicked.",example:"Google Search PPC.",proTip:"Negative keywords save 20% wasted spend.",level:"Beginner"},{id:59,term:"Programmatic Advertising",category:"Performance",definition:"Automated buying of ad inventory via RTB.",example:"The Trade Desk DSP buys across web.",proTip:"Use private deals for premium inventory.",level:"Advanced"},{id:60,term:"Native Advertising",category:"Content",definition:"Ads matching platform's content style.",example:"Taboola 'You may like' articles.",proTip:"Headline curiosity gap + listicle LPs.",level:"Intermediate"},{id:61,term:"Guerrilla Marketing",category:"Branding",definition:"Unconventional low-cost high-impact tactics.",example:"Red Bull Stratos space jump.",proTip:"Think PR stunt + social amplification.",level:"Intermediate"},{id:62,term:"Experiential Marketing",category:"Branding",definition:"Immersive brand experiences.",example:"IKEA sleepover in store.",proTip:"Capture content at experience for scale.",level:"Intermediate"},{id:63,term:"Brand Voice",category:"Branding",definition:"Consistent personality in communication.",example:"Wendy's sassy Twitter, Mailchimp friendly quirky.",proTip:"Define 3 traits + do/don't list + example sentences.",level:"Beginner"},{id:64,term:"Brand Architecture",category:"Branding",definition:"Structure of brands within company.",example:"P&G house of brands, Apple branded house.",proTip:"Branded house = efficiency, House of brands = risk diversification.",level:"Advanced"},{id:65,term:"Brand Awareness",category:"Branding",definition:"Extent to which consumers recognize brand.",example:"Unaided recall: 'Name soda brand' → Coca-Cola.",proTip:"Track via surveys: aided + unaided recall.",level:"Beginner"},{id:66,term:"Brand Loyalty",category:"Branding",definition:"Tendency to repeatedly choose same brand.",example:"Harley Davidson community loyalty.",proTip:"Loyalty ladder: Awareness → Preference → Loyalty → Advocacy.",level:"Beginner"},{id:67,term:"Brand Story",category:"Branding",definition:"Narrative encompassing facts + emotions of brand.",example:"Patagonia environmental activism story.",proTip:"Use StoryBrand framework: Character, Problem, Guide, Plan.",level:"Intermediate"},{id:68,term:"Co-Branding",category:"Branding",definition:"Two brands collaborating.",example:"Nike × Off-White, GoPro × Red Bull.",proTip:"Align values + audiences, clear who leads.",level:"Intermediate"},{id:69,term:"Rebranding",category:"Branding",definition:"Changing brand identity.",example:"Twitter → X, Facebook → Meta.",proTip:"Rebrand for reason: audience shift, reputation, M&A.",level:"Intermediate"},{id:70,term:"Tagline",category:"Branding",definition:"Memorable phrase capturing brand essence.",example:"Nike: Just Do It. L'Oréal: Because you're worth it.",proTip:"Keep <6 words, benefit-driven, timeless.",level:"Beginner"},{id:71,term:"Visual Identity",category:"Branding",definition:"Visual elements: logo, colors, typography.",example:"Spotify green, Netflix red, Tiffany blue.",proTip:"Own a color: 80% recognition from color alone.",level:"Beginner"},{id:72,term:"Tone of Voice",category:"Content",definition:"How brand sounds: formal vs casual etc.",example:"Duolingo playful threatening, LinkedIn professional.",proTip:"Create tone spectrum for situations.",level:"Beginner"},{id:73,term:"Content Pillar",category:"Content",definition:"Core themes brand consistently talks about.",example:"Glossier pillars: skincare, community, inclusivity.",proTip:"3-5 pillars, each supports business goal.",level:"Intermediate"},{id:74,term:"Content Calendar",category:"Content",definition:"Plan of what content when.",example:"30-day calendar: M=Reels, W=Carousel, F=UGC.",proTip:"Batch 70% evergreen, 30% timely.",level:"Beginner"},{id:75,term:"Editorial Calendar",category:"Content",definition:"Long-term content strategy plan.",example:"Q4 calendar aligned to holidays + launches.",proTip:"Include owner, stage, KPI per piece.",level:"Intermediate"},{id:76,term:"Evergreen Content",category:"Content",definition:"Content staying relevant long time.",example:"'How to tie a tie' video 5M views yearly.",proTip:"Evergreen = 80% of organic traffic long-term.",level:"Beginner"},{id:77,term:"Thought Leadership",category:"Content",definition:"Positioning as expert via insights.",example:"Gong.io publishing sales data research.",proTip:"Original data + contrarian POV = thought leadership.",level:"Intermediate"},{id:78,term:"Social Proof",category:"Content",definition:"People follow actions of others.",example:"Reviews, testimonials, '10k+ happy customers'.",proTip:"5 types: expert, celebrity, user, wisdom of crowd, friends.",level:"Beginner"},{id:79,term:"FOMO",category:"Content",definition:"Fear Of Missing Out tactic.",example:"'Only 3 left', countdown timer.",proTip:"Scarcity + urgency, but must be real to keep trust.",level:"Beginner"},{id:80,term:"Call To Action",abbr:"CTA",category:"Content",definition:"Prompt to take specific action.",example:"'Start Free Trial' button.",proTip:"Verb + benefit + urgency: 'Get My Free Audit Today'.",level:"Beginner"},{id:81,term:"Hook",category:"Content",definition:"First 3 seconds to stop scroll.",example:"TikTok hook: 'I wasted $10k so you don't have to'.",proTip:"Use pattern interrupt: controversial, surprising stat, question.",level:"Beginner"},{id:82,term:"Engagement Rate",category:"Social",definition:"Interactions divided by followers/reach.",example:"10k followers, 500 likes+comments = 5% ER",formula:"ER = (Likes+Comments+Shares)/Followers ×100",proTip:"IG Reels avg 1.5%, TikTok 6%. Save rate is new gold.",level:"Beginner"},{id:83,term:"Reach",category:"Social",definition:"Number of unique people who saw content.",example:"Reel reached 50k accounts.",proTip:"Reach = distribution, Impressions = total views (incl repeat).",level:"Beginner"},{id:84,term:"Impressions",category:"Analytics",definition:"Total times content displayed.",example:"Post 10k reach, 15k impressions (some saw twice).",proTip:"High impressions + low engagement = content mismatch.",level:"Beginner"},{id:85,term:"Virality",category:"Social",definition:"Rapid spread of content.",example:"Ocean Spray Fleetwood Mac TikTok.",proTip:"Emotion + practical value + social currency = viral triggers (STEPPS).",level:"Intermediate"},{id:86,term:"Hashtag Strategy",category:"Social",definition:"Using tags to increase discoverability.",example:"Mix: 3 big, 5 medium, 5 niche, 2 branded.",proTip:"IG: 15-20 hashtags in caption, 3-5 in Reels now works better.",level:"Beginner"},{id:87,term:"Community Management",category:"Social",definition:"Building & managing community around brand.",example:"Duolingo replying to every TikTok comment.",proTip:"Reply within 60 mins = +30% engagement algorithm boost.",level:"Intermediate"},{id:88,term:"Social Listening",category:"Social",definition:"Monitoring mentions & sentiment online.",example:"Use Brandwatch to track 'Starbucks' sentiment.",proTip:"Listen for jobs-to-be-done, not just mentions.",level:"Intermediate"},{id:89,term:"Dark Social",category:"Social",definition:"Sharing not tracked: WhatsApp, DMs.",example:"Link shared in private Slack.",proTip:"Use copy link tracking + 'How did you hear about us?'.",level:"Advanced"},{id:90,term:"Share of Voice",abbr:"SOV",category:"Analytics",definition:"Your visibility vs competitors.",example:"Your brand 30% SOV in category search.",formula:"SOV = Brand mentions / Total market mentions",proTip:"SOV ≈ Market Share long-term. Increase SOV → Share.",level:"Intermediate"},{id:91,term:"Attribution",category:"Analytics",definition:"Assigning credit to touchpoints for conversion.",example:"Last-click vs first-click vs data-driven.",proTip:"Use multi-touch + incrementality tests, not just last-click.",level:"Advanced"},{id:92,term:"Marketing Attribution Model",category:"Analytics",definition:"Rule for crediting conversions.",example:"Linear gives equal credit to all touches.",proTip:"Data-driven attribution uses ML - most accurate.",level:"Advanced"},{id:93,term:"Customer Data Platform",abbr:"CDP",category:"Analytics",definition:"Unifies customer data across sources.",example:"Segment CDP merges website, app, email data.",proTip:"CDP = single customer view for personalization.",level:"Advanced"},{id:94,term:"Marketing Automation",category:"Digital",definition:"Software automating marketing tasks.",example:"HubSpot workflow: download → nurture → MQL.",proTip:"Automate repetitive, humanize strategic.",level:"Intermediate"},{id:95,term:"Lead Scoring",category:"Digital",definition:"Ranking leads by sales-readiness.",example:"Score +10 for pricing page visit, +20 demo request.",proTip:"Combine explicit (title) + implicit (behavior).",level:"Intermediate"},{id:96,term:"CRM",category:"Digital",definition:"Customer Relationship Management system.",example:"Salesforce tracks all customer interactions.",proTip:"CRM hygiene = revenue. Dedup weekly.",level:"Beginner"},{id:97,term:"Sales Enablement",category:"Strategy",definition:"Providing sales with content/tools to sell.",example:"Battle cards, case studies, ROI calculator.",proTip:"Marketing + Sales SLA: MQL definition + follow-up <5min.",level:"Intermediate"},{id:98,term:"Account Based Marketing",abbr:"ABM",category:"Strategy",definition:"Target specific high-value accounts.",example:"Personalized landing page for Salesforce as target.",proTip:"ABM = 97% higher ROI than traditional. 1:1, 1:few, 1:many.",level:"Advanced"},{id:99,term:"Inbound Marketing",category:"Content",definition:"Attract customers via valuable content, not ads.",example:"HubSpot coined it: blog, SEO, free tools.",proTip:"Inbound = magnet, Outbound = megaphone.",level:"Beginner"},{id:100,term:"Outbound Marketing",category:"Strategy",definition:"Proactive outreach to potential customers.",example:"Cold email, cold call, LinkedIn outreach.",proTip:"Personalize first line, 3-touch sequence, provide value first.",level:"Beginner"},{id:101,term:"Demand Generation",abbr:"Demand Gen",category:"Strategy",definition:"Creating awareness & demand for product.",example:"Webinars, reports, events to create demand.",proTip:"Demand Gen = long game (education), Lead Gen = short game (capture).",level:"Intermediate"},{id:102,term:"Lead Generation",category:"Performance",definition:"Process of attracting & converting strangers to leads.",example:"Gated ebook → 500 leads.",proTip:"Gate 10% content, ungate 90% for SEO + trust.",level:"Beginner"},{id:103,term:"MQL vs SQL",category:"Strategy",definition:"Marketing Qualified vs Sales Qualified Lead.",example:"MQL: Downloaded ebook. SQL: Requested demo + budget.",proTip:"Define criteria together with sales.",level:"Intermediate"},{id:104,term:"TAM SAM SOM",category:"Strategy",definition:"Market sizing: Total, Serviceable, Obtainable.",example:"TAM coffee $400B, SAM specialty $80B, SOM your city $2M.",proTip:"Investors want TAM > $1B, SOM realistic 1-5% in 3y.",level:"Intermediate"},{id:105,term:"Blue Ocean Strategy",category:"Strategy",definition:"Create uncontested market space, make competition irrelevant.",example:"Cirque du Soleil: circus + theater, no animals.",proTip:"Use Four Actions Framework: Eliminate, Reduce, Raise, Create.",level:"Advanced"},{id:106,term:"Red Ocean Strategy",category:"Strategy",definition:"Compete in existing crowded market.",example:"Coke vs Pepsi soda wars.",proTip:"Win via differentiation or cost leadership.",level:"Intermediate"},{id:107,term:"Porter's Five Forces",category:"Strategy",definition:"Analyze competitive intensity: suppliers, buyers, new entrants, substitutes, rivalry.",example:"Airline industry: high rivalry, high buyer power.",proTip:"Use to decide where to compete and profitability.",level:"Advanced"},{id:108,term:"Ansoff Matrix",category:"Strategy",definition:"Growth strategies: Market Penetration, Product Development, Market Development, Diversification.",example:"Starbucks: Same product new country = Market Development.",proTip:"Risk increases clockwise from penetration to diversification.",level:"Intermediate"},{id:109,term:"BCG Matrix",category:"Strategy",definition:"Portfolio: Stars, Cash Cows, Question Marks, Dogs.",example:"Apple: iPhone = Cash Cow, Vision Pro = Question Mark.",proTip:"Invest in Stars, milk Cash Cows, divest Dogs.",level:"Intermediate"},{id:110,term:"Jobs To Be Done",abbr:"JTBD",category:"Strategy",definition:"Customers hire products to get job done.",example:"People hire milkshake to kill boredom on commute, not hunger.",proTip:"Interview: 'What were you doing before you bought?'",level:"Advanced"},{id:111,term:"Value Chain",category:"Strategy",definition:"Activities company performs to deliver value.",example:"Zara value chain: design→manufacture→distribute in 2 weeks.",proTip:"Find competitive advantage in chain link.",level:"Intermediate"},{id:112,term:"Moat",category:"Strategy",definition:"Sustainable competitive advantage.",example:"Network effect moat: Instagram more valuable as more friends join.",proTip:"7 moats: Network, Brand, Scale, Switching cost, IP, Culture, Cornered resource.",level:"Advanced"},{id:113,term:"Flywheel",category:"Strategy",definition:"Self-reinforcing loop that builds momentum.",example:"Amazon flywheel: More selection → More customers → More sellers → More selection.",proTip:"Find one flywheel, obsess over it.",level:"Advanced"},{id:114,term:"North Star Metric",category:"Analytics",definition:"Single metric predicting long-term success.",example:"Spotify NSM = Time spent listening, Airbnb = Nights booked.",proTip:"Good NSM = value to customer + revenue + actionable.",level:"Intermediate"},{id:115,term:"Cohort Analysis",category:"Analytics",definition:"Group users by shared characteristic & track over time.",example:"Users who signed up Jan vs Feb retention curve.",proTip:"Use for retention, not just acquisition.",level:"Intermediate"},{id:116,term:"Funnel Analysis",category:"Analytics",definition:"Track conversion through steps, find drop-offs.",example:"Checkout funnel: Cart 100% → Shipping 70% → Payment 40%.",proTip:"Biggest drop = biggest opportunity.",level:"Beginner"},{id:117,term:"Heatmap",category:"Analytics",definition:"Visual of where users click/scroll.",example:"Hotjar heatmap shows no one scrolls past hero.",proTip:"Combine heatmap + session replay for why.",level:"Beginner"},{id:118,term:"Session Replay",category:"Analytics",definition:"Record user sessions.",example:"Watch user rage-click checkout button.",proTip:"Filter by frustration signals: rage clicks, u-turns.",level:"Intermediate"},{id:119,term:"UTM Parameters",category:"Analytics",definition:"Tags added to URL to track source.",example:"utm_source=instagram&utm_medium=reels&utm_campaign=launch",proTip:"Use lowercase, consistent naming. Build sheet.",level:"Beginner"},{id:120,term:"Pixel",category:"Analytics",definition:"Code tracking user actions for ads.",example:"Meta Pixel tracks ViewContent, AddToCart, Purchase.",proTip:"Set up Conversions API + Pixel for iOS14 resilience.",level:"Beginner"},{id:121,term:"Customer Satisfaction",abbr:"CSAT",category:"Analytics",definition:"How satisfied customers are.",example:"Post-support survey: 1-5 rating.",formula:"CSAT = Satisfied responses / Total ×100",proTip:"Ask right after interaction, not weeks later.",level:"Beginner"},{id:122,term:"Customer Effort Score",abbr:"CES",category:"Analytics",definition:"How easy it was to get issue resolved.",example:"'How easy was it to...?' 1-7 scale.",proTip:"CES predicts loyalty better than CSAT.",level:"Intermediate"},{id:123,term:"Sentiment Analysis",category:"Analytics",definition:"AI detecting emotion in text.",example:"Analyze 10k reviews: 70% positive about delivery.",proTip:"Track sentiment shift after campaign.",level:"Intermediate"},{id:124,term:"Social Commerce",category:"Social",definition:"Selling directly on social platforms.",example:"Instagram Shop, TikTok Shop checkout.",proTip:"Social commerce will be 17% of ecommerce by 2026.",level:"Intermediate"},{id:125,term:"Live Shopping",category:"Social",definition:"Live stream selling products.",example:"TikTok Live: Creator demos product, viewers buy live.",proTip:"Prep 3 hooks, scarcity, pinned product.",level:"Intermediate"},{id:126,term:"Shoppable Content",category:"Social",definition:"Content where you can buy directly.",example:"Tap product tag in Instagram Reel.",proTip:"Make first 3 seconds shoppable, not just end.",level:"Beginner"},{id:127,term:"Meme Marketing",category:"Social",definition:"Using memes to promote brand.",example:"Duolingo unhinged owl memes.",proTip:"Be native, not brandy. Comment section > feed for memes.",level:"Intermediate"},{id:128,term:"Moment Marketing",category:"Social",definition:"Reacting to real-time events.",example:"Oreo 'You can still dunk in dark' during Super Bowl blackout.",proTip:"Prep 70% templates, leave 30% for moments.",level:"Intermediate"},{id:129,term:"Newsjacking",category:"Content",definition:"Injecting brand into breaking news.",example:"Brand tweets about Barbie movie with product tie-in.",proTip:"Speed > perfection. 2-hour window.",level:"Intermediate"},{id:130,term:"Evergreen Funnel",category:"Performance",definition:"Automated funnel running continuously.",example:"Webinar → Email → Offer evergreen.",proTip:"Update evergreen yearly or it decays.",level:"Intermediate"},{id:131,term:"Tripwire",category:"Performance",definition:"Irresistible low-ticket offer to convert leads to buyers.",example:"$7 template to $97 course upsell.",proTip:"Tripwire should be no-brainer, 10x value vs price.",level:"Intermediate"},{id:132,term:"Order Bump",category:"Performance",definition:"Extra offer at checkout.",example:"'Add gift wrap $4.99' checkbox.",proTip:"Order bump converts 30-40% - always add.",level:"Intermediate"},{id:133,term:"Downsell",category:"Performance",definition:"Cheaper alternative when they decline.",example:"Declined $97? Offer $37 lite version.",proTip:"Downsell saves 10-15% of lost sales.",level:"Intermediate"},{id:134,term:"Scarcity Marketing",category:"Content",definition:"Using limited availability to drive action.",example:"'Only 2 seats left at this price'.",proTip:"Real scarcity only. Fake kills trust.",level:"Beginner"},{id:135,term:"Anchoring",category:"Branding",definition:"Cognitive bias: first price sets reference.",example:"Show $500 crossed, now $99 feels cheap.",proTip:"Anchor high, then reveal actual. Works 2x.",level:"Intermediate"},{id:136,term:"Decoy Effect",category:"Branding",definition:"Third option makes one option more attractive.",example:"Small $3, Medium $6.50, Large $7 → Most pick Large.",proTip:"Decoy should be asymmetrically dominated.",level:"Advanced"},{id:137,term:"Social Proof Stack",category:"Content",definition:"Multiple proofs together.",example:"Logos + Testimonials + Number
